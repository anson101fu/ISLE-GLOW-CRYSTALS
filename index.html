er;margin:28px 0 24px;color:var(--muted)}.empty-symbol{display:grid;place-items:center;margin:0 auto 10px;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;font-size:22px;color:#a39888}.empty-message h3{font-size:12px;font-weight:400;margin-bottom:6px}.empty-message p{font-size:11px}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-height:520px;overflow-y:auto;padding-bottom:10px}.placeholder{border:1px dashed var(--line);border-radius:16px;background:linear-gradient(#fcfbf9,#fff);aspect-ratio:.9;min-height:115px;display:flex;align-items:center;justify-content:center}.placeholder:before{content:'';width:40%;aspect-ratio:1;border:1px dashed #e6dfd180;border-radius:50%}.product{border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}.product-image{width:60px;height:60px;display:grid;place-items:center;background:#f4f1ea;border-radius:50%;margin:0 auto 12px;color:var(--muted)}.product-image img{width:100%;height:100%;object-fit:contain;border-radius:50%}.product h3{font-size:11px;font-weight:500;text-align:center;overflow-wrap:anywhere}.product p{font-size:10px;color:var(--muted);text-align:center;margin:5px 0}.size-actions{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:10px}.size-actions button{font-size:10px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--cream)}dialog{border:1px solid var(--line);border-radius:24px;padding:28px;width:min(420px,calc(100% - 32px));max-height:90vh;overflow-y:auto;color:var(--ink);box-shadow:0 20px 60px #00000024}dialog::backdrop{background:#2c2c2c66;backdrop-filter:blur(4px)}.modal-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.modal-heading h2{font-size:18px;font-weight:300;letter-spacing:.08em}.icon-btn{background:none;border:0;color:var(--muted);font-size:25px}.modal-copy{font-size:12px;line-height:2;margin-bottom:24px;color:#665c52}form>label{display:flex;fle <body>
<main class="shell">
<header class="header">
 <div class="header-top"><div class="brand-block"><h1 id="brand" aria-label="品牌名稱預留"></h1><p id="subtitle" data-i18n="subtitle">設計工作台</p></div><div class="account"><span data-i18n="guest">訪客</span><button class="btn dark small" id="account" data-i18n="account">登入 / 註冊</button></div></div>
 <div class="language-row"><span>SELECT LANGUAGE</span><nav aria-label="Language" class="languages"><button data-lang="zh" class="active">繁</button><button data-lang="zh_cn">简</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></nav></div>
</header>
<div class="workspace">
 <section class="preview-panel" aria-label="設計預覽">
  <div><div class="target-bar"><label for="target" data-i18n="target">目標尺寸</label><select id="target"><option value="140">14 cm</option><option value="150" selected>15 cm</option><option value="160">16 cm</option><option value="170">17 cm</option><option value="180">18 cm</option></select><span id="status" role="status"></span></div>
  <div class="view-tabs" role="group" aria-label="Preview mode"><button id="view-2d" class="active" data-i18n="view2d" aria-pressed="true">2D 排版設計</button><button id="view-3d" data-i18n="view3d" aria-pressed="false">3D 佩戴預覽</button></div>
  <div class="canvas-wrap"><div id="stage" class="stage"><div id="string" class="string"></div><div class="wrist"></div><div id="nodes"></div><div id="canvas-empty" class="canvas-empty" data-i18n="previewEmpty">設計預覽區</div></div><p class="rotation-tip" id="rotation-tip" data-i18n="rotate">左右拖曳旋轉預覽</p></div></div>
  <div class="preview-bottom"><div class="total-box"><div><p class="eyebrow" data-i18n="total">總計</p><p id="summary">0 件 | 0 mm</p></div><strong id="price">HK$0.00</strong></div>
   <div class="color-bar"><label for="color" data-i18n="string">線條顏色</label><input id="color" type="color" value="#c5a059"><div class="swatches"><button data-color="#c5a059" style="--swatch:#c5a059" aria-label="Gold"></button><button data-color="#2c2c2c" style="--swatch:#2c2c2c" aria-label="Black"></button><button data-color="#e6dfd1" style="--swatch:#e6dfd1" aria-label="Ivory"></button><button data-color="#a39888" style="--swatch:#a39888" aria-label="Taupe"></button></div></div>
   <div class="actions"><button class="btn dark" id="save" data-i18n="save">保存設計</button><button class="btn" id="reset" data-i18n="reset">重新開始</button></div>
   <p class="hint" data-i18n="tip">加入素材後可拖曳排序，按 × 移除。</p>
  </div>
 </section>
 <section class="library-panel" aria-label="素材庫">
  <div class="feature-card"><div class="feature-top"><h2 data-i18n="feature">內容預留區</h2><div><button class="btn gold small" id="auto" data-i18n="auto">自動配搭</button><button class="btn glass small" id="settings" data-i18n="settings">設定</button></div></div><p id="feature-description" data-i18n="featureDesc">保留原有版面位置，之後可放品牌介紹、推薦內容或自訂功能。</p></div>
  <div class="category-tabs"><button data-category="product" class="active" data-i18n="products">產品</button><button data-category="accessory" data-i18n="accessories">配件</button></div>
  <div class="collections"><p class="eyebrow" data-i18n="collections">系列分類</p><div class="filter-row"><button data-filter="all" class="active" data-i18n="all">所有系列</button><button data-filter="1" data-i18n="series1">系列一</button><button data-filter="2" data-i18n="series2">系列二</button><button data-filter="3" data-i18n="series3">系列三</button><button data-filter="4" data-i18n="series4">系列四</button></div></div>
  <div class="library-heading"><h2 data-i18n="library">素材庫</h2><span id="product-count"></span></div>
  <div class="empty-message" id="empty-message"><span class="empty-symbol">＋</span><h3 data-i18n="emptyTitle">暫未加入產品</h3><p data-i18n="emptyDesc">產品圖片、名稱及價格已留空。</p></div>
  <div id="product-list" class="product-grid"></div>
 </section>
</div>
</main>
<dialog id="settings-modal"><form id="settings-form"><div class="modal-heading"><h2 data-i18n="settingsTitle">工作台設定</h2><button type="button" class="icon-btn" data-close aria-label="Close">×</button></div><label><span data-i18n="brandLabel">品牌名稱（可留空）</span><input id="brand-input" maxlength="80"></label><label><span data-i18n="introLabel">介紹內容（可留空）</span><textarea id="intro-input" rows="3" maxlength="600"></textarea></label><p class="hint" data-i18n="localNote">設定和設計只保存在目前瀏覽器。</p><div class="modal-actions"><button type="button" class="btn" id="restore" data-i18n="restore">讀取已存設計</button><button type="submit" class="btn dark" data-i18n="apply">套用設定</button></div></form></dialog>
<dialog id="account-modal"><div class="modal-heading"><h2 data-i18n="account">登入 / 註冊</h2><button class="icon-btn" data-close aria-label="Close">×</button></div><p class="modal-copy" data-i18n="accountNote">已保留會員入口。新網站尚未接駁會員系統；目前可直接在此瀏覽器保存設計。</p><button class="btn dark full" data-close data-i18n="close">關閉</button></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* 網站內容設定：保留空白即可作為框架使用。所有價格以 HKD 為基準。
   要新增產品，可在 products 陣列加入：
   { id: 'item-001', category: 'product', collection: '1',
     name: { zh: '產品名稱', zh_cn: '产品名称', en: 'Product name', ru: 'Название' },
     image: 'assets/item-001.jpg', sizes: [8, 10, 12], price: 0 }
   category: product / accessory；collection: 1 / 2 / 3 / 4。
   將圖片放入 assets 資料夾。未有圖片時會顯示中性佔位圖。
   單一尺寸可設 sizes: [10]。price 是每件單價，並非真實匯率報價。
*/
window.SITE_CONFIG = {
  brand: '',
  intro: '',
  currency: 'HKD',
  // 固定顯示幣別；切換語言不會自動改價或套用未核實匯率。
  products: []
};

'use strict';
const config = window.SITE_CONFIG || {brand:'',intro:'',products:[],currency:'HKD'};
const products = Array.isArray(config.products) ? config.products : [];
const I18N = {

};
const $ = id => document.getElementById(id);
let lang='zh', category='product', filter='all', mode='2d', rotation=0, items=[], nextId=1;
let brand=config.brand||'', intro=config.intro||'', toastTimer;
const storageKey='blank-workspace-v1';
const t = key => I18N[lang][key] || I18N.zh[key] || key;
const safeImage = value => typeof value==='string' && (/^(assets\/|\.\/assets\/|https?:\/\/|data:image\/(png|jpeg|webp|gif);base64,)/i.test(value)) ? value : '';
function nameOf(p){return typeof p.name==='string'?p.name:(p.name?.[lang]||p.name?.zh||p.name?.en||t('unnamed'));}
function money(value){try{return new Intl.NumberFormat({zh:'zh-HK',zh_cn:'zh-CN',en:'en-US',ru:'ru-RU'}[lang],{style:'currency',currency:config.currency||'HKD'}).format(value);}catch{return `HKD ${value.toFixed(2)}`;}}
function toast(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3200);}
function setLanguage(value){
 if(!I18N[value])return;lang=value;document.documentElement.lang={zh:'zh-HK',zh_cn:'zh-CN',en:'en',ru:'ru'}[lang];document.title=brand||t('subtitle');
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 document.querySelectorAll('[data-lang]').forEach(el=>{el.classList.toggle('active',el.dataset.lang===lang);el.setAttribute('aria-pressed',String(el.dataset.lang===lang));});
 $('brand').textContent=brand;$('feature-description').textContent=intro||t('featureDesc');renderList();render();
}
function filtered(){return products.filter(p=>p.category===category&&(filter==='all'||String(p.collection)===filter));}
function renderList(){
 document.querySelectorAll('[data-category]').forEach(el=>{el.classList.toggle('active',el.dataset.category===category);el.setAttribute('aria-pressed',String(el.dataset.category===category));});
 document.querySelectorAll('[data-filter]').forEach(el=>{el.classList.toggle('active',el.dataset.filter===filter);el.setAttribute('aria-pressed',String(el.dataset.filter===filter));});
 const list=filtered();$('product-count').textContent=`${list.length} ${t('unit')}`;$('product-list').replaceChildren();$('empty-message').hidden=!!list.length;
 $('empty-message').querySelector('h3').textContent=t(products.length?'noMatches':'emptyTitle');
 if(!list.length){for(let i=0;i<6;i++){const box=document.createElement('div');box.className='placeholder';box.setAttribute('aria-hidden','true');$('product-list').append(box);}return;}
 list.forEach(p=>{
  const card=document.createElement('article');card.className='product';
  const imageBox=document.createElement('div');imageBox.className='product-image';const image=safeImage(p.image);
  if(image){const img=document.createElement('img');img.src=image;img.alt=nameOf(p);img.addEventListener('error',()=>{imageBox.textContent='＋';});imageBox.append(img);}else imageBox.textContent='＋';
  const title=document.createElement('h3');title.textContent=nameOf(p);const price=document.createElement('p');price.textContent=money(Number(p.price)||0);
  const actions=document.createElement('div');actions.className='size-actions';
  (Array.isArray(p.sizes)?p.sizes:[10]).filter(s=>Number.isFinite(Number(s))&&Number(s)>0).forEach(size=>{const button=document.createElement('button');button.textContent=`+ ${size} mm`;button.setAttribute('aria-label',`${nameOf(p)} + ${size} mm`);button.onclick=()=>{addItem(p,Number(size));render();};actions.append(button);});
  card.append(imageBox,title,price,actions);$('product-list').append(card);
 });
}
function addItem(product,size){items.push({uid:nextId++,productId:product.id,size,price:Math.max(0,Number(product.price)||0)});}
function render(){
 const totalLength=items.reduce((s,p)=>s+p.size,0),target=Number($('target').value),total=items.reduce((s,p)=>s+p.price,0);
 $('summary').textContent=`${items.length} ${t('unit')} | ${totalLength} mm`;$('price').textContent=money(total);
 $('status').textContent=t(!items.length?'start':totalLength<target-6?'short':totalLength>target+6?'long':'fit');
 const stage=$('stage');stage.classList.toggle('has-items',!!items.length);stage.classList.toggle('mode-3d',mode==='3d');$('canvas-empty').hidden=!!items.length;$('rotation-tip').style.display=mode==='3d'?'block':'none';
 $('view-2d').classList.toggle('active',mode==='2d');$('view-3d').classList.toggle('active',mode==='3d');$('view-2d').setAttribute('aria-pressed',String(mode==='2d'));$('view-3d').setAttribute('aria-pressed',String(mode==='3d'));
 $('nodes').replaceChildren();const width=stage.clientWidth||300,center=width/2,radius=width*.37;
 items.forEach((item,index)=>{
  const product=products.find(p=>p.id===item.productId);if(!product)return;
  const angle=index/items.length*Math.PI*2-Math.PI/2+(mode==='3d'?rotation:0),depth=Math.sin(angle);
  const x=center+radius*Math.cos(angle),y=center+(mode==='3d'?radius*.34:radius)*Math.sin(angle)+(mode==='3d'?10:0);
  const size=Math.min(64,item.size*(width/100))*(mode==='3d'?.78+(depth+1)*.11:1);
  const node=document.createElement('div');node.className='node';node.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;z-index:${mode==='3d'?(depth>0?10:1):5};`;
  node.setAttribute('aria-label',nameOf(product));
  node.tabIndex=mode==='2d'?0:-1;
  node.onkeydown=e=>{if(mode!=='2d'||e.target!==node)return;if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();items=items.filter(p=>p.uid!==item.uid);render();}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const from=items.findIndex(p=>p.uid===item.uid),to=(from+(e.key==='ArrowRight'?1:-1)+items.length)%items.length;items.splice(to,0,items.splice(from,1)[0]);render();}};
  const image=safeImage(product.image);if(image){const img=document.createElement('img');img.src=image;img.alt=nameOf(product);img.draggable=false;node.append(img);}
  const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',`${t('removed')} ${nameOf(product)}`);remove.onpointerdown=e=>e.stopPropagation();remove.onclick=()=>{items=items.filter(p=>p.uid!==item.uid);render();};node.append(remove);
  node.onpointerdown=e=>{
   if(mode!=='2d'||e.button!==0)return;e.preventDefault();node.setPointerCapture(e.pointerId);node.style.zIndex='20';
   node.onpointermove=move=>{const rect=stage.getBoundingClientRect();node.style.left=(move.clientX-rect.left)+'px';node.style.top=(move.clientY-rect.top)+'px';};
   node.onpointerup=end=>{const rect=stage.getBoundingClientRect(),dx=end.clientX-rect.left-center,dy=end.clientY-rect.top-center;const angle=(Math.atan2(dy,dx)+Math.PI/2+Math.PI*2)%(Math.PI*2);const target=Math.round(angle/(Math.PI*2/items.length))%items.length;const source=items.findIndex(p=>p.uid===item.uid);items.splice(target,0,items.splice(source,1)[0]);render();};
   node.onpointercancel=()=>render();
  };$('nodes').append(node);
 });
}
function setColor(value){if(!/^#[0-9a-f]{6}$/i.test(value))return;$('color').value=value;document.documentElement.style.setProperty('--string',value);}
function snapshot(){return {version:1,brand,intro,items,color:$('color').value,target:$('target').value};}
function readSaved(){try{const raw=localStorage.getItem(storageKey);return raw?JSON.parse(raw):null;}catch{toast(t('storageError'));return null;}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(snapshot()));toast(t('saved'));}catch{toast(t('storageError'));}}
function restore(){const saved=readSaved();if(!saved){toast(t('noSaved'));return;}
 if(saved.version!==1||!Array.isArray(saved.items)||typeof saved.brand!=='string'||typeof saved.intro!=='string'){toast(t('invalidSaved'));return;}
 brand=saved.brand.slice(0,80);intro=saved.intro.slice(0,600);items=saved.items.filter(i=>products.some(p=>p.id===i.productId)&&Number.isFinite(i.size)&&i.size>0&&Number.isFinite(i.price)&&i.price>=0).map(i=>({...i,uid:nextId++}));
 if(['140','150','160','170','180'].includes(String(saved.target)))$('target').value=String(saved.target);setColor(saved.color);setLanguage(lang);$('settings-modal').close();toast(t('restored'));
}
$('save').onclick=save;$('reset').onclick=()=>{items=[];rotation=0;render();};$('target').onchange=render;$('color').oninput=e=>setColor(e.target.value);
$('view-2d').onclick=()=>{mode='2d';render();};$('view-3d').onclick=()=>{mode='3d';render();};
$('stage').onpointerdown=e=>{if(mode!=='3d'||e.button!==0)return;const stage=$('stage');stage.setPointerCapture(e.pointerId);let previous=e.clientX;stage.onpointermove=move=>{rotation+=(move.clientX-previous)*.015;previous=move.clientX;render();};const end=()=>{stage.onpointermove=null;};stage.onpointerup=end;stage.onpointercancel=end;};
$('auto').onclick=()=>{const pool=filtered().filter(p=>Array.isArray(p.sizes)&&p.sizes.some(s=>Number(s)>0));if(!pool.length){toast(t('noProducts'));return;}items=[];let length=0,index=0;const target=Number($('target').value);while(length<target&&index<100){const p=pool[index%pool.length],size=Number(p.sizes.find(s=>Number(s)>0));if(!Number.isFinite(size))break;addItem(p,size);length+=size;index++;}render();};
$('settings').onclick=()=>{$('brand-input').value=brand;$('intro-input').value=intro;$('settings-modal').showModal();};
$('settings-form').onsubmit=e=>{e.preventDefault();brand=$('brand-input').value.trim();intro=$('intro-input').value.trim();setLanguage(lang);$('settings-modal').close();try{localStorage.setItem(storageKey,JSON.stringify(snapshot()));toast(t('settingsSaved'));}catch{toast(t('storageError'));}};
$('restore').onclick=restore;$('account').onclick=()=>$('account-modal').showModal();
for(const dialog of document.querySelectorAll('dialog')){dialog.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});}
for(const button of document.querySelectorAll('[data-lang]'))button.onclick=()=>setLanguage(button.dataset.lang);
for(const button of document.querySelectorAll('[data-category]'))button.onclick=()=>{category=button.dataset.category;renderList();};
for(const button of document.querySelectorAll('[data-filter]'))button.onclick=()=>{filter=button.dataset.filter;renderList();};
for(const button of document.querySelectorAll('[data-color]'))button.onclick=()=>setColor(button.dataset.color);
window.addEventListener('resize',render);setLanguage('zh');

</script>
</body></html>
